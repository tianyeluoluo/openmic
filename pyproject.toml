[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmic-course-project"
version = "0.1.0"
description = "A multi-agent Chinese stand-up comedy generation system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "autogen-agentchat==0.2.40",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "streamlit>=1.35,<2",
]

[project.optional-dependencies]
learning = [
  "scikit-learn>=1.3,<1.8",
  "onnxruntime>=1.18,<2",
  "tokenizers>=0.20,<0.23",
  "opencc-python-reimplemented==0.1.7",
]

[project.scripts]
openmic = "openmic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
